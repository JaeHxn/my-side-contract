name: Supabase Migrations

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch: # 수동 실행 가능

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run migrations via psql
        env:
          PROJ: ${{ secrets.SUPABASE_PROJECT_REF }}
          PASS: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          DB_URL="postgresql://postgres.${PROJ}:${PASS}@aws-0-ap-south-1.pooler.supabase.com:6543/postgres"
          echo "Connecting to Supabase..."
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "→ $f"
            psql "${DB_URL}" -f "$f" -v ON_ERROR_STOP=1
          done
          echo "✅ All migrations complete"
