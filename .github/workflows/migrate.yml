name: Supabase Migrations

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch: # 수동 실행 가능

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run migrations via psql
        env:
          DATABASE_URL: "postgresql://postgres.${{ secrets.SUPABASE_PROJECT_REF }}:${{ secrets.SUPABASE_DB_PASSWORD }}@aws-0-ap-northeast-2.pooler.supabase.com:6543/postgres"
        run: |
          echo "Running migrations..."
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "→ $f"
            psql "$DATABASE_URL" -f "$f" -v ON_ERROR_STOP=1
          done
          echo "✅ All migrations complete"
